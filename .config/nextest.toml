# nextest configuration.
#
# The Dovecot and Proton Bridge integration binaries each spawn Docker/Podman
# containers per test. Running many in parallel triggers container-daemon
# contention (port mapping races, mmap failures during dovecot worker startup,
# volume-mount relabeling under SELinux). Cap those binaries to a small
# concurrency so the rest of the workspace still runs at full parallelism.

[test-groups]
container-backed = { max-threads = 4 }
# The network-chaos binary (#522) spins TWO containers per test (Dovecot +
# Toxiproxy) and uses tight timeout budgets; run it serially so container/CPU
# contention cannot starve a healthy boot within its budget (which would flake
# the connect/command-timeout assertions). Nightly-only, so wall-time is fine.
chaos-backed = { max-threads = 1 }

# `rimap-server`'s own container-backed binaries belong in the group too, and
# were outside it. Each of these calls `DovecotHarness::try_start`, which brings
# up a per-test compose project — the exact thing the group exists to throttle —
# and `e2e_smtp*` adds a Mailpit container on top. Only `e2e_wire_chaos` was
# ever listed, via `chaos-backed` below.
#
# Be honest about what this buys and where. On CI it buys nothing: the coverage
# runner reports 4 logical CPUs (#692 records the measurement in the SonarQube
# job), and nextest's default test concurrency is the logical CPU count, so a
# `max-threads = 4` cap can never bind there. It binds on a developer host,
# which is where the daemon contention above was actually observed and where
# these ten binaries have been running unthrottled. Raising CI's effective cap
# is a separate calibration question, deliberately not answered here.
#
# Listed by exact name (`=`) rather than as the substring `binary(e2e)`, which
# would also capture the `e2e_wire_*` binaries that spawn no container and
# collide with `chaos-backed`'s claim on `e2e_wire_chaos`. The cost is that a
# renamed or newly added container-backed binary must be added here; the
# alternative silently throttles a dozen container-free binaries instead.
[[profile.default.overrides]]
filter = '''
  binary(dovecot) + binary(proton)
  + binary(=e2e) + binary(=e2e_smtp) + binary(=e2e_smtp_real)
  + binary(=e2e_wire) + binary(=e2e_wire_cancellation)
  + binary(=e2e_wire_destructive) + binary(=e2e_wire_fault_injection)
  + binary(=e2e_wire_folder_management)
  + binary(=e2e_wire_multi_account_advertisement)
  + binary(=e2e_wire_tool_advertisement)
'''
test-group = 'container-backed'

[[profile.default.overrides]]
filter = 'binary(e2e_wire_chaos)'
test-group = 'chaos-backed'

# After a test process exits, nextest waits up to `leak-timeout` for its
# stdout/stderr pipes to be observed closed, and reports a LEAK marker if the
# window expires. The built-in default is 100 ms, which is inside the scheduling
# noise band on a machine starting several test processes at once: running only
# the three `rimap-imap` poison binaries on an 18-CPU host produced a marker in
# 8 of 60 runs, and the most frequent leaker was `poison_reconnect`, which
# spawns no child process at all. Those tests hold no handle that could outlive
# them — the leak window opens after process exit, by which point the kernel has
# closed every descriptor the process held (#630). The markers were a timing
# artifact of the window, not a resource leak.
#
# 5s is deliberately far above the regime the artifacts occur in rather than
# just past it. The same three binaries measured 0 markers in 50 runs at 2s, but
# that is the smallest value shown sufficient on a fast, lightly loaded host;
# CI runners have fewer cores and run the whole workspace, so their tail is
# worse. The cost of the larger window is only paid when a marker would have
# fired anyway, so overshooting is cheap and undershooting reintroduces the
# noise.
#
# Leaks are fatal (`result = "fail"`, #642): a marker now fails the run on
# every profile that inherits this table, including the required test jobs and
# nightly chaos. The workspace does have genuinely subprocess-spawning tests
# (the Dovecot/Proton/chaos harnesses shell out to the container runtime, the
# wire harness spawns the server binary), so fatality waited on calibration:
# every nightly-chaos run since the window landed plus a contention-covering
# sample of required-job runs (2026-08-04..21) produced zero LEAK markers.
# The table form needs cargo-nextest >= NEXTEST_MIN (see justfile).
#
# Declared after the overrides above so both profile tables read together;
# `[profile.ci]` inherits this, and so does every recipe that passes no profile
# (`test-fast`, `test-proton`, `test-injection`, nightly-chaos), which is where
# the markers were actually observed.
[profile.default]
leak-timeout = { period = "5s", result = "fail" }
# A test that hangs silently consumes a full GitHub job slot until the 360-minute
# default kills it with no test name in the output — the only diagnostic is
# "exceeded the maximum execution time" (#728). `slow-timeout` bounds that:
# nextest reports the still-running test by name at every `period` boundary and
# kills it after `terminate-after` periods. At 60 s × 3 the kill fires at 3 min.
#
# Container-backed tests (Dovecot + Mailpit, `container-backed` group above) take
# ~10–60 s per warm boot on a developer host per AGENTS.md. Each *test* sees its
# own compose project and readiness probe, so the relevant unit is per-test wall
# time, not total suite time. A 60 s slow-period warns the first time a test
# approaches the warm-boot ceiling without killing it; the 180 s terminate fires
# only at 3× that ceiling, which is comfortably beyond even a cold first pull.
# No per-binary override is needed.
#
# `e2e_wire_chaos` runs serially (`chaos-backed`, max-threads = 1) with tight
# timeout budgets *inside* each test (e.g. a 30 s connect-timeout assertion). The
# slow period at 60 s will warn when a chaos scenario takes longer than expected,
# but the test's own `tokio::time::timeout` fires first; the nextest 180 s kill is
# a backstop that has no meaningful interaction with those in-process budgets.
#
# Declared on `[profile.default]` so it applies everywhere — CI (via [profile.ci]
# inheritance), `just test`, `just test-fast`, and local ad-hoc runs. The
# alternative — `[profile.ci]`-only — would leave a developer with a hung test
# and no attribution, which is the problem this fixes.
slow-timeout = { period = "60s", terminate-after = 3 }

# Quiet-by-default output for agent ingestion (#827). `status-level = "fail"`
# prints live lines for failures only — the per-test PASS heartbeat is context
# waste for an agent and noise for humans. `failure-output = "final"` groups
# captured failure bodies at the end of the run instead of interleaving them
# across parallel tests mid-stream ("immediate-final" would print each body
# twice). `final-status-level = "slow"` is cumulative (includes retry + fail),
# so the run tail lists every failure and every test above the slow-timeout
# period with its duration — fresh timing data on every run, which is what
# lets an agent calibrate runtimes without a committed timing table.
#
# Version note: suppressing the mid-run slow-period warn lines under
# `status-level = "fail"` holds on nextest >= 0.9.133 (upstream #3236 fixed
# their display); older versions — including the NEXTEST_MIN floor 0.9.95 —
# render a corrupt mid-run line (duration and name, no status) instead of
# hiding it. The final summary is unaffected either way.
status-level = "fail"
failure-output = "final"
final-status-level = "slow"

# nextest's built-in default is fail-fast = true: the first failure cancels
# the run and every test still in flight is reported as "not run" rather than
# pass or fail (#625). That is fine for a quick local iteration loop — see
# `test-fast` in justfile, which intentionally keeps the built-in default so
# a developer sees the first failure and stops — but it is the wrong
# trade-off for `just test`/`just test-msrv` and CI's "test (stable)" /
# "test (MSRV 1.88.0)" jobs, where an unrelated flake or a container hiccup
# (Docker port/address-pool contention under `binary(dovecot)` /
# `binary(e2e)`) can suppress hundreds of unrelated results.
#
# `fail-fast = false` was considered and rejected: an unbounded run gives up
# the one thing fail-fast protects, a bound on how many tests a genuinely
# broken branch gets to run. `retries` was also considered and rejected: a
# test passing on retry is not evidence the code is correct, and retries
# would have quietly absorbed the #621 flake instead of surfacing it.
# `max-fail` keeps both properties: every result from a bounded number of
# independent failures is still visible, and a broadly-broken branch still
# aborts instead of running the rest of the suite.
#
# max-fail bounds failure *count*, not wall-clock time — it is not a
# substitute for a job-level timeout. If the container daemon itself is
# unhealthy, the 20 failures budgeted here can each be a slow container-backed
# test (`container-backed` above throttles those to max-threads = 4), so this
# profile can still cost several minutes of CI time before aborting. That is
# an accepted, bounded cost, not the near-instant abort fail-fast = true gave
# a systemic failure.
[profile.ci]
fail-fast = { max-fail = 20 }

# Machine-readable results for agent ingestion (#827). One table under the
# default profile; [profile.ci] inherits it, so `--profile ci` runs write
# target/nextest/ci/junit.xml and default-profile runs (test-fast, ad-hoc)
# write target/nextest/default/junit.xml. Defaults do the right thing:
# store-failure-output = true embeds each failing test's captured
# stdout/stderr; success output stays unstored. The file is written once at
# the end of a run — a missing file means the run did not complete.
[profile.default.junit]
path = "junit.xml"

# A full macOS arm64 `just ci` reported LEAK-FAIL at 5.014 s for a pure string
# test that has no descendant or inherited handle (#846). The isolated test and
# a repeated follow-up suite were green, so the marker establishes delayed EOF
# observation under whole-suite contention rather than a genuine leak. Keep
# fatal detection, but give macOS hosts a provisional 30 s observation window.
# This is host-scoped: cross-compiling for macOS must retain the executing
# host's policy. A future false positive at 30 s requires contemporaneous
# process-tree evidence before this bound changes again. This override follows
# every default-profile table so later keys cannot accidentally join it.
[[profile.default.overrides]]
platform = { host = 'cfg(target_os = "macos")' }
leak-timeout = { period = "30s", result = "fail" }
