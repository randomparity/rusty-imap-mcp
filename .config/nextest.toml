# nextest configuration.
#
# The Dovecot and Proton Bridge integration binaries each spawn Docker/Podman
# containers per test. Running many in parallel triggers container-daemon
# contention (port mapping races, mmap failures during dovecot worker startup,
# volume-mount relabeling under SELinux). Cap those binaries to a small
# concurrency so the rest of the workspace still runs at full parallelism.

[test-groups]
container-backed = { max-threads = 4 }
# The network-chaos binary (#522) spins TWO containers per test (Dovecot +
# Toxiproxy) and uses tight timeout budgets; run it serially so container/CPU
# contention cannot starve a healthy boot within its budget (which would flake
# the connect/command-timeout assertions). Nightly-only, so wall-time is fine.
chaos-backed = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(dovecot) + binary(proton)'
test-group = 'container-backed'

[[profile.default.overrides]]
filter = 'binary(e2e_wire_chaos)'
test-group = 'chaos-backed'

# nextest's built-in default is fail-fast = true: the first failure cancels
# the run and every test still in flight is reported as "not run" rather than
# pass or fail (#625). That is fine for a quick local iteration loop — see
# `test-fast` in justfile, which intentionally keeps the built-in default so
# a developer sees the first failure and stops — but it is the wrong
# trade-off for `just test`/`just test-msrv` and CI's "test (stable)" /
# "test (MSRV 1.88.0)" jobs, where an unrelated flake or a container hiccup
# (Docker port/address-pool contention under `binary(dovecot)` /
# `binary(e2e)`) can suppress hundreds of unrelated results.
#
# `fail-fast = false` was considered and rejected: an unbounded run removes
# the one thing fail-fast protects, wall-clock cost on a genuinely broken
# branch. `retries` was also considered and rejected: a test passing on
# retry is not evidence the code is correct, and retries would have quietly
# absorbed the #621 flake instead of surfacing it. `max-fail` keeps both
# properties — every result from a bounded number of independent failures is
# still visible, and a broadly-broken branch still aborts instead of paying
# for the full (container-backed) suite.
[profile.ci]
fail-fast = { max-fail = 20 }
