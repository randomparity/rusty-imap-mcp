# cargo-deny policy for rusty-imap-mcp. Four concerns: advisories, licenses,
# bans (duplicate versions, disallowed crates), and sources (registry allowlist).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    # quoted_printable 0.5 (transitive of lettre) uses 0BSD — the BSD Zero
    # Clause License, an OSI-approved permissive license more liberal than MIT
    # (no attribution required). Accepted for Sprint 2b's rimap-smtp crate.
    "0BSD",
    # webpki-roots >= 0.26.10 re-licensed from MPL-2.0 to CDLA-Permissive-2.0
    # (Community Data License Agreement). It's a legitimate permissive license
    # published by the Linux Foundation. Accepted here because the alternative
    # is pinning to stale root certs.
    "CDLA-Permissive-2.0",
    # `foldhash` 0.2 (transitive via `governor 0.10` → `hashbrown 0.16` →
    # `foldhash`) is Zlib-licensed. Zlib is OSI-approved, FSF Free/Libre,
    # and permissive (no copyleft, no attribution beyond license text).
    # Accepted for the governor 0.10 upgrade.
    "Zlib",
    # `borrow-or-share` 0.2.4 (transitive via `jsonschema` → `referencing`
    # → `fluent-uri` → `borrow-or-share`) is MIT-0. MIT-0 ("MIT No
    # Attribution") is OSI-approved and strictly more permissive than
    # MIT — no attribution clause, no other obligations. Surfaced when
    # `--features fuzzing` (#266) promoted `jsonschema` from a dev-dep
    # to a feature-gated regular dep. Both `just deny` and CI (the
    # `cargo-deny-action`, whose `arguments` input defaults to
    # `--all-features`) scan with `--all-features`, activating `fuzzing`
    # and pulling the subtree into the non-dev graph so this allowance is
    # exercised. Drop it if the `just deny` recipe ever stops passing
    # `--all-features`, or it will read as unused.
    "MIT-0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Allow wildcard version reqs *only* for path (workspace-internal) deps. The
# three self-referential dev-deps (rimap-content/rimap-smtp/rimap-server depend
# on themselves to enable their own `test-support` feature) are path-only with
# no `version =` so that `cargo publish` drops them from the published manifest
# (a versioned self dev-dep would try to resolve a not-yet-published self at
# publish-verify time — issue #544). A path dep resolves to a specific local
# crate, never an arbitrary registry version, so this does not weaken the
# wildcard ban's real purpose (catching accidental `foo = "*"` registry deps).
allow-wildcard-paths = true
highlight = "all"
# Documented exceptions. Each entry must justify why a workaround is preferable
# to upgrading the offending dependency.
skip = [
    # `hashbrown` 0.14 is pulled in by `dashmap` (transitive of `governor`),
    # while 0.16 comes in via `indexmap` (transitive of `toml`). Both are
    # stable upstream choices we cannot influence without forking.
    { name = "hashbrown", version = "0.14" },

    # The four entries below all trace to `async-imap 0.11.2` — the only
    # maintained pure-Rust async IMAP client. Its direct deps include
    # `stop-token 0.7` (last released 2022, unmaintained but harmless) which
    # pulls the 1.x line of the `async` runtime primitives, while async-imap
    # itself uses the 2.x line. `thiserror 1` is also a direct, non-optional
    # pin from async-imap. None can be resolved with `cargo update`; forking
    # async-imap is not warranted. Revisit when async-imap modernizes.
    { name = "async-channel", version = "1" },
    { name = "event-listener", version = "2" },
    { name = "thiserror", version = "1" },
    { name = "thiserror-impl", version = "1" },

    # `nom` v7 is pulled by async-imap (via imap-proto), while v8 enters
    # via lettre. Both are the latest releases from their respective
    # consumers. Cannot unify without forking. Revisit when async-imap
    # bumps imap-proto to a nom 8 release.
    { name = "nom", version = "7" },

    # `utf7-imap 0.3.2` depends on `base64 0.13`, while `async-imap` and
    # `rmcp` use `base64 0.22`. utf7-imap is unmaintained upstream with
    # this pin; the older base64 is a pure encoder/decoder with no
    # security advisories. Revisit if utf7-imap publishes a 0.4 bump.
    { name = "base64", version = "0.13" },

    # `syn` is mid-migration across the whole derive ecosystem. The 3.x line
    # enters via `thiserror-impl 2.0.19` and `clap_derive 4.6.4`, while 2.x is
    # still what `serde_derive`, `async-trait`, `cssparser-macros`, and
    # `zerocopy-derive` build against. Holding the tree on 2.x was viable once
    # (commit f1052de4 downgraded clap to do exactly that) but is not anymore:
    # it would now mean pinning both clap and thiserror backwards against an
    # upstream migration that is only going to spread. Both are build-time-only
    # proc-macro deps, so the duplicate costs compile time and nothing at
    # runtime. Skip the 2.x line specifically so that once the stragglers
    # publish syn 3 releases this entry starts reporting `unnecessary-skip` —
    # that warning is the signal to delete it.
    { name = "syn", version = "2" },

    # `getrandom` is pulled in three versions by upstream-pinned crates:
    #   - 0.2 via `ring 0.17` (rustls transitive). `ring` pins getrandom 0.2
    #     and has no 0.3-compatible release as of this writing. Replacing
    #     `ring`/`rustls` is out of scope.
    #   - 0.3 via `rand 0.9` (governor + proptest transitive — see the
    #     `rand`/`rand_core` skips below).
    #   - 0.4 via `rand 0.10` (our direct dep, replacing `rand_chacha` with
    #     RustCrypto `chacha20`) and `tempfile 3.x` (dev-dep; also
    #     proptest/insta transitive).
    # None of these can be unified without forking. Revisit when `ring`
    # publishes a release using getrandom >= 0.3.
    { name = "getrandom", version = "0.2" },
    { name = "getrandom", version = "0.3" },
    { name = "getrandom", version = "0.4" },

    # `rand 0.9` and `rand_core 0.9` are pulled in by three upstream
    # crates that pin `rand = "0.9"` at a caret range excluding 0.10:
    #   - `governor 0.10.4` (regular dep via the `jitter` feature, used
    #     by `rimap-authz`).
    #   - `ulid 1.2.1` (regular dep via the default `std` feature, used
    #     by `rimap-audit` for ULID generation).
    #   - `proptest 1.11.0` (dev-dep across multiple crates).
    # All three are at their latest crates.io release. The workspace
    # itself uses `rand 0.10` for `RedactionSalt` in `rimap-audit`.
    # Forking governor, ulid, or proptest is out of scope. Revisit when
    # all three upstreams publish `rand 0.10`–compatible releases.
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },

    # `hashbrown` 0.16 enters via `governor 0.10` (latest), while 0.17
    # comes in via `indexmap 2.14` (transitive of `toml`/`mail-parser`).
    # Both are upstream-pinned to their latest releases; we cannot unify
    # without forking. Revisit when governor bumps to hashbrown 0.17.
    { name = "hashbrown", version = "0.16" },

    # `io-lifetimes` 2.0.4 is pulled by `fs-set-times 0.20.3` (latest), a
    # transitive dep of `cap-primitives`/`cap-std 4` (the #317 sandbox
    # dir-fd writer). cap-std and its other Bytecode Alliance deps
    # (`cap-primitives`, `io-extras`) already use the 3.x line; only
    # `fs-set-times` lags on its io-lifetimes pin. All are at their latest
    # crates.io releases — `cargo update` cannot unify across the 2.x/3.x
    # major split. Revisit when `fs-set-times` bumps to io-lifetimes 3.
    { name = "io-lifetimes", version = "2" },

    # The phf family is duplicated by our direct `phf`/`phf_codegen` 0.14 bump
    # (rimap-content's confusables perfect-hash table, Sprint 4b) versus the
    # phf 0.13 line pulled transitively through `cssparser 0.37`
    # (← ammonia 4.1 / scraper 0.27 / selectors 0.38 / web_atoms). cssparser
    # pins phf 0.13 at its latest release; we cannot lift it without forking the
    # ammonia/scraper HTML-sanitization stack, and our direct dep tracks the
    # newest phf. Revisit when cssparser publishes a phf 0.14 release.
    { name = "phf", version = "0.13" },
    { name = "phf_codegen", version = "0.13" },
    { name = "phf_generator", version = "0.13" },
    { name = "phf_shared", version = "0.13" },
]
# Multiple `windows-sys` major lines coexist because each transitive
# consumer (`directories`, `keyring`/`dbus-secret-service`, `rpassword`,
# `clap`/`anstream`, `tempfile`/`rustix`) pins to a different release of the
# Windows ABI shim. Skipping the older subtree keeps Windows targets in
# cargo-deny scope without forcing a coordinated upgrade across unrelated
# ecosystems. The newest version (0.61) remains the canonical one; only the
# 0.59 subtree needs skipping to satisfy the 0.59-vs-0.61 duplicate.
#
# `windows-sys 0.52` is pulled by `ring 0.17` only under
# `cfg(all(target_arch = "aarch64", target_os = "windows"))`, i.e. exclusively
# on `aarch64-pc-windows-msvc`. That target is not in the `[graph] targets`
# list above, so 0.52 never enters cargo-deny's graph and needs no skip entry.
# If a future lockfile brings 0.52 into a configured target, cargo-deny will
# flag it and a `skip` can be added then.
skip-tree = [
    { name = "windows-sys", version = "0.59" },
]
# psl (via addr) uses a versioning scheme where the patch number
# tracks the Public Suffix List snapshot date (e.g. 2.1.200). This
# is legitimate but looks like a massive version bump to naive
# pattern matching.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
