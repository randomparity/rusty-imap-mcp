name: nightly-html-oracle

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-html-oracle
  cancel-in-progress: false

jobs:
  html-oracle:
    # Scopes CORPUS_READ_TOKEN to this job's environment instead of leaving
    # it readable by every workflow (#755 follow-up). The nightly runs on
    # schedule and dispatch, both from main — hence the branch-only policy.
    environment: corpus-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout corpus (pinned SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: randomparity/rusty-imap-mcp-corpus
          ref: d90cafe938a2c1e2d5d99b9d37893c1ab1d0fb09  # PINNED — bump via reviewed PR only (wave-2, #554)
          path: corpus
          token: ${{ secrets.CORPUS_READ_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: html-oracle

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-deny

      - name: Supply-chain audit (oracle graph)
        run: cargo deny --locked --manifest-path html-oracle/Cargo.toml check advisories bans licenses sources

      - name: Run differential oracle
        # CORPUS_MIN_COMPARED = floor(0.9 × corpus_compared_nonempty) from the
        # wave-2 baseline (#554: 0.9 × 575 = 517); recompute and bump alongside
        # the pinned SHA. Unset it to disable the floor (empty-corpus proof).
        env:
          CORPUS_MIN_COMPARED: "517"
        run: >
          cargo run --locked --manifest-path html-oracle/Cargo.toml --
          --repo-root . --corpus-root corpus
          ${CORPUS_MIN_COMPARED:+--corpus-min-compared "$CORPUS_MIN_COMPARED"}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-oracle-report
          path: html-oracle/report.json
          if-no-files-found: warn
          retention-days: 7
