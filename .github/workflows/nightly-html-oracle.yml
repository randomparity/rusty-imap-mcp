name: nightly-html-oracle

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-html-oracle
  cancel-in-progress: false

jobs:
  html-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout corpus (pinned SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: randomparity/rusty-imap-mcp-corpus
          ref: d90cafe938a2c1e2d5d99b9d37893c1ab1d0fb09  # PINNED — bump via reviewed PR only (wave-2, #554)
          path: corpus
          token: ${{ secrets.CORPUS_READ_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: html-oracle

      - name: Install cargo-deny
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-deny

      - name: Supply-chain audit (oracle graph)
        run: cargo deny --locked --manifest-path html-oracle/Cargo.toml check advisories bans licenses sources

      - name: Run differential oracle
        # CORPUS_MIN_COMPARED = floor(0.9 × corpus_compared_nonempty) from the
        # wave-2 baseline (#554: 0.9 × 575 = 517); recompute and bump alongside
        # the pinned SHA. Unset it to disable the floor (empty-corpus proof).
        env:
          CORPUS_MIN_COMPARED: "517"
        run: >
          cargo run --locked --manifest-path html-oracle/Cargo.toml --
          --repo-root . --corpus-root corpus
          ${CORPUS_MIN_COMPARED:+--corpus-min-compared "$CORPUS_MIN_COMPARED"}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-oracle-report
          path: html-oracle/report.json
          if-no-files-found: warn
          retention-days: 7
