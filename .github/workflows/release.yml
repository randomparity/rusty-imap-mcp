name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verify-tag only; skip build and release jobs."
        type: boolean
        default: true
      tag:
        description: "Tag to validate (e.g. v0.1.0). Used only on workflow_dispatch."
        type: string
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BINARY_NAME: rusty-imap-mcp

jobs:
  # Gates every build/release job below via `needs: verify-tag`. Fails fast on
  # tag/Cargo.toml drift, malformed tag formats, or a `-dev` literal in the
  # manifest. workflow_dispatch with `dry_run: true` exercises just this job.
  verify-tag:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Exposed for future jobs that need the parsed version. Currently unused; the
    # tag itself is what gates the build, so removing this output is fine if no
    # consumer materializes.
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Verify tag
        id: verify
        env:
          TAG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ./scripts/check-release-version.sh "$TAG_REF"
          echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"

  # Generate manpages once and share to every build leg. Test-support subcommands
  # are absent because xtask's rimap-server dep sets default-features = false
  # (cfg-gating them out); the guard step fails loudly if that ever regresses.
  manpages:
    name: Generate manpages
    needs: verify-tag
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # xtask compiles rimap-server, which links system libdbus via
      # keyring -> dbus-secret-service on Linux (xtask does not enable
      # vendored-keyring). Without this the build fails with
      # "Package 'dbus-1' was not found". Mirrors every compiling job in the repo.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable
      - name: Generate manpages
        run: cargo run -p xtask --no-default-features --release --locked -- man --out man/man1
      - name: Guard — no test-support pages shipped
        run: |
          if ls man/man1/rusty-imap-mcp-dump-tool-*.1 >/dev/null 2>&1; then
            echo "::error::test-support subcommand manpages were generated" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1/*.1
          if-no-files-found: error

  build-linux-x86_64:
    name: build (x86_64-unknown-linux-gnu)
    needs: [verify-tag, manpages]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # Build in a bookworm container (glibc 2.36) — the SAME baseline as the
      # arm64 leg — so both packaged binaries share one declared glibc floor
      # (deb `libc6 (>= 2.36)`, rpm `glibc >= 2.36`), and the package manager can
      # gate compatibility instead of a runtime GLIBC_x.xx crash. Native amd64
      # container: no QEMU. vendored-keyring static-links libdbus; --target pins
      # the output under target/<triple>/release/ for cargo-deb/generate-rpm.
      # rust:1.88.0-bookworm as of 2026-04-13
      - name: Build in x86_64 (bookworm) container
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0 \
            bash -c "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config && cargo install cargo-auditable --locked --version 0.7.4 && cargo auditable build --release --locked -p rimap-server --features vendored-keyring --target x86_64-unknown-linux-gnu"
          # Container ran as root; host-side packaging runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Download manpages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          triple="x86_64-unknown-linux-gnu"
          stage="${BINARY_NAME}-${TAG}-${triple}"
          mkdir "$stage"
          cp "target/${triple}/release/${BINARY_NAME}" "$stage/${BINARY_NAME}"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "$stage/"
          mkdir -p "$stage/share/man/man1"
          cp man/man1/*.1 "$stage/share/man/man1/"
          tar czf "${stage}.tar.gz" "$stage"
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.21.0
      - name: Build + verify packages
        run: scripts/build-verify-packages.sh x86_64-unknown-linux-gnu
      # Digest-pinned throwaway install-test images (matches the digest-pinned
      # build image; no floating tags). debian:stable / fedora:latest as of
      # 2026-07-11; bump deliberately to test newer bases.
      - name: Install-test .deb (no libdbus present)
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg \
            debian@sha256:9631e4628fccfb6f1ff9e27de2af0e82f61591c78d1584c778f92db9a541a3cc bash -c \
            'apt-get update && apt-get install -y ./*.deb && rusty-imap-mcp --version'
      - name: Install-test .rpm (no dbus-libs present)
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg \
            fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898 bash -c \
            'dnf install -y ./*.rpm && rusty-imap-mcp --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            ${{ env.BINARY_NAME }}-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            *.deb
            *.rpm

  build-linux-aarch64:
    name: build (aarch64-unknown-linux-gnu)
    needs: [verify-tag, manpages]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: linux/arm64
      # Built inside an emulated aarch64 container (same pattern as the ppc64le
      # and s390x jobs) rather than via `cross`: cross 0.2.5 rejects the
      # `auditable` custom subcommand host-side before its Cross.toml pre-build
      # hook can install cargo-auditable in the container. Building natively in
      # the target container also compiles the vendored libdbus for aarch64
      # without a cross C toolchain. vendored-keyring static-links libdbus so
      # the tarball/bottle binary carries no runtime libdbus-1.so dependency.
      - name: Build in aarch64 container
        # rust:1.88.0-bookworm as of 2026-04-13
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0 \
            bash -c "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config && cargo install cargo-auditable --locked --version 0.7.4 && cargo auditable build --release --locked -p rimap-server --features vendored-keyring --target aarch64-unknown-linux-gnu"
          # The container ran as root and left target/ owned by root; host-side
          # packaging (cargo-deb/cargo-generate-rpm) runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Download manpages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          triple="aarch64-unknown-linux-gnu"
          stage="${BINARY_NAME}-${TAG}-${triple}"
          mkdir "$stage"
          cp "target/${triple}/release/${BINARY_NAME}" "$stage/${BINARY_NAME}"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "$stage/"
          mkdir -p "$stage/share/man/man1"
          cp man/man1/*.1 "$stage/share/man/man1/"
          tar czf "${stage}.tar.gz" "$stage"
      # Packages are built host-side (x86_64 runner) via --target; cargo-deb maps
      # the triple to the arm64 Debian/RPM Architecture. No emulated install-test
      # for arm64 (structural + content assertion only — ADR-0006).
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.21.0
      - name: Build + verify packages
        run: scripts/build-verify-packages.sh aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-aarch64-unknown-linux-gnu
          path: |
            ${{ env.BINARY_NAME }}-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            *.deb
            *.rpm

  build-macos-aarch64:
    name: build (aarch64-apple-darwin)
    needs: [verify-tag, manpages]
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.4
      - run: cargo auditable build --release --locked
      - name: Download manpages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          triple="aarch64-apple-darwin"
          stage="${BINARY_NAME}-${TAG}-${triple}"
          mkdir "$stage"
          cp "target/release/${BINARY_NAME}" "$stage/${BINARY_NAME}"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "$stage/"
          mkdir -p "$stage/share/man/man1"
          cp man/man1/*.1 "$stage/share/man/man1/"
          tar czf "${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-aarch64-apple-darwin
          path: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

  build-linux-ppc64le:
    name: build (powerpc64le-unknown-linux-gnu)
    needs: [verify-tag, manpages]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: linux/ppc64le
      - name: Build in ppc64le container
        # rust:1.88.0-bookworm as of 2026-04-13
        run: |
          docker run --rm --platform linux/ppc64le \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0 \
            bash -c "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config && cargo install cargo-auditable --locked --version 0.7.4 && cargo auditable build --release --locked"
      # Not vendored: ppc64le has no Homebrew bottle path; this tarball retains
      # a dynamic libdbus link (documented in README as needing libdbus-1-3).
      - name: Download manpages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          triple="powerpc64le-unknown-linux-gnu"
          stage="${BINARY_NAME}-${TAG}-${triple}"
          mkdir "$stage"
          cp "target/release/${BINARY_NAME}" "$stage/${BINARY_NAME}"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "$stage/"
          mkdir -p "$stage/share/man/man1"
          cp man/man1/*.1 "$stage/share/man/man1/"
          tar czf "${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-powerpc64le-unknown-linux-gnu
          path: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-powerpc64le-unknown-linux-gnu.tar.gz

  build-linux-s390x:
    name: build (s390x-unknown-linux-gnu)
    needs: [verify-tag, manpages]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: linux/s390x
      - name: Build in s390x container
        # rust:1.88.0-bookworm as of 2026-04-13
        run: |
          docker run --rm --platform linux/s390x \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0 \
            bash -c "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config && cargo install cargo-auditable --locked --version 0.7.4 && cargo auditable build --release --locked"
      # Not vendored: s390x has no Homebrew bottle path; this tarball retains a
      # dynamic libdbus link (documented in README as needing libdbus-1-3).
      - name: Download manpages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rusty-imap-mcp-manpages
          path: man/man1
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          triple="s390x-unknown-linux-gnu"
          stage="${BINARY_NAME}-${TAG}-${triple}"
          mkdir "$stage"
          cp "target/release/${BINARY_NAME}" "$stage/${BINARY_NAME}"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "$stage/"
          mkdir -p "$stage/share/man/man1"
          cp man/man1/*.1 "$stage/share/man/man1/"
          tar czf "${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-s390x-unknown-linux-gnu
          path: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-s390x-unknown-linux-gnu.tar.gz

  release:
    name: Create GitHub Release
    needs:
      - verify-tag
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-aarch64
      - build-linux-ppc64le
      - build-linux-s390x
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          # Per-target artifacts only (tarballs + .deb + .rpm). Excludes the
          # internal rusty-imap-mcp-manpages artifact so raw .1 files never land
          # on the release page.
          pattern: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-*
          merge-multiple: true
      - name: Stage install.sh with version baked in
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # These are literal strings to find/insert in install.sh, not expanded here.
          # shellcheck disable=SC2016
          marker='RUSTY_IMAP_MCP_VERSION="${RUSTY_IMAP_MCP_VERSION:-}"'
          # shellcheck disable=SC2016
          replace='RUSTY_IMAP_MCP_VERSION="${RUSTY_IMAP_MCP_VERSION:-'"$TAG"'}"'
          python3 - "$marker" "$replace" <<'PY'
          import sys, pathlib
          marker, replace = sys.argv[1], sys.argv[2]
          src = pathlib.Path("install.sh").read_text()
          out = src.replace(marker, replace, 1)
          assert out != src, f"install.sh marker not found: {marker!r}"
          pathlib.Path("artifacts/install.sh").write_text(out)
          PY
          chmod +x artifacts/install.sh
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd artifacts
          # Hash every release file (tarballs, .deb, .rpm, install.sh). Sorted,
          # LF-only for reproducibility across re-runs of the same input set.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            artifacts/rusty-imap-mcp-*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { p=1; next }
              p && /^## \[/         { exit }
              p && /^\[[^]]+\]: /    { exit }
              p                     { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG} (expected a '## [${VERSION}]' heading). Add a dated release section before tagging." >&2
            exit 1
          fi
          head -20 RELEASE_NOTES.md
      # Publishes directly (no --draft): the homebrew/bottles jobs download
      # assets from the public releases/download CDN, which only serves a
      # published release. See ADR-0002.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            artifacts/${{ env.BINARY_NAME }}-*.tar.gz \
            artifacts/*.deb \
            artifacts/*.rpm \
            artifacts/install.sh \
            artifacts/SHA256SUMS.txt

  # Publish the 8 workspace crates to crates.io in dependency order, after the
  # GitHub Release + artifacts are up (a downstream leaf: its failure does not
  # un-publish the release). Stable tags only, push only — never a -dev tag or
  # workflow_dispatch. Gated behind the `crates-io` environment holding
  # CARGO_REGISTRY_TOKEN, with no required reviewer (ADR-0004). The FIRST publish
  # reserves 8 new names and exceeds crates.io's new-crate burst (5); reserve
  # locally first (RELEASING.md). Subsequent releases publish new versions
  # (burst 30) in one run.
  publish-crates:
    name: Publish to crates.io
    needs: release
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    # Steady-state (new versions of existing crates, burst 30) finishes in a few
    # minutes. Cap the job so a pathological rate-limit retry loop fails fast
    # rather than idling toward GitHub's default cap; the first 8-new-name
    # publish is documented as a local, paced run (RELEASING.md), not this job.
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # The publish verify build compiles rimap-config -> keyring (Linux libdbus).
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-semver-checks@0.48.0
      # Gate: fail the publish on accidental SemVer breakage vs the last
      # crates.io release. No-ops on the first release (no baseline).
      - name: Check for SemVer breakage
        run: cargo semver-checks check-release --workspace
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh

  # Renders homebrew/rusty-imap-mcp.rb.template into the tap on stable v* tags.
  # Prerelease tags never reach here (verify-tag rejects any '-'); the guard is
  # retained as forward-compatible defense for the Phase 2 -dev model.
  homebrew:
    name: Bump randomparity/homebrew-tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    # Gates the HOMEBREW_TAP_TOKEN behind an environment (matches the
    # sonarcloud/SONAR_TOKEN pattern). Unconfigured today, so no approval stall.
    environment: homebrew-tap
    permissions:
      contents: read
    steps:
      - name: Checkout rusty-imap-mcp (for template)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: randomparity/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true
      - name: Render formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/randomparity/rusty-imap-mcp/releases/download/${TAG}"
          # --retry absorbs releases/download CDN propagation lag: this job runs
          # seconds after publish and the CDN can briefly 404/5xx a live asset.
          curl_retry() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 5 "$1"
          }
          # The release job already published SHA256SUMS.txt over the tarballs;
          # parse it (one small request) instead of re-downloading each tarball.
          SUMS="$(curl_retry "${BASE}/SHA256SUMS.txt")"
          sum_for() {
            local s
            s=$(printf '%s\n' "$SUMS" | awk -v f="$1" '$2 == f { print $1 }')
            if [ -z "$s" ]; then
              echo "::error::no SHA256SUMS.txt entry for $1" >&2
              exit 1
            fi
            printf '%s' "$s"
          }
          MAC_ARM_SHA=$(sum_for   "rusty-imap-mcp-${TAG}-aarch64-apple-darwin.tar.gz")
          LINUX_ARM_SHA=$(sum_for "rusty-imap-mcp-${TAG}-aarch64-unknown-linux-gnu.tar.gz")
          LINUX_INTEL_SHA=$(sum_for "rusty-imap-mcp-${TAG}-x86_64-unknown-linux-gnu.tar.gz")
          # The GitHub source archive is not in SHA256SUMS.txt — hash it directly.
          SRC_SHA=$(curl_retry "https://github.com/randomparity/rusty-imap-mcp/archive/refs/tags/${TAG}.tar.gz" | sha256sum | awk '{print $1}')
          mkdir -p tap/Formula
          sed \
            -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{MAC_ARM_SHA}}|${MAC_ARM_SHA}|g" \
            -e "s|{{LINUX_ARM_SHA}}|${LINUX_ARM_SHA}|g" \
            -e "s|{{LINUX_INTEL_SHA}}|${LINUX_INTEL_SHA}|g" \
            -e "s|{{SRC_SHA}}|${SRC_SHA}|g" \
            homebrew/rusty-imap-mcp.rb.template > tap/Formula/rusty-imap-mcp.rb
      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rusty-imap-mcp.rb
          if git diff --staged --quiet; then
            echo "Formula already up-to-date for ${TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "rusty-imap-mcp ${TAG#v}"
          git push

  # Build native Homebrew bottles so `brew install` pours a prebuilt binary
  # instead of running `install` under Homebrew's build sandbox. Runs after the
  # (bottle-less) formula is pushed. No libdbus-1-3 install: the poured Linux
  # binary is vendored (static libdbus), so neither runner nor user needs it.
  bottles:
    name: Build bottle (${{ matrix.label }})
    needs: homebrew
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # upload bottle tarballs to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: arm64 macOS
          - os: ubuntu-latest
            label: x86_64 Linux
          - os: ubuntu-24.04-arm
            label: arm64 Linux
    steps:
      # SHA-pinned setup action instead of `curl | bash` of the installer at a
      # floating HEAD (this job holds contents: write). macOS runners ship brew.
      - name: Set up Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac  # master 2026-06
        with:
          stable: true
      - name: Build, bottle, and upload
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/randomparity/rusty-imap-mcp/releases/download/${TAG}"
          brew tap randomparity/tap
          brew install --build-bottle randomparity/tap/rusty-imap-mcp
          workdir="$(mktemp -d)"
          cd "$workdir"
          # --root-url bakes the release download base into the JSON so the later
          # --merge writes a bottle do block that resolves to these assets.
          brew bottle --json --no-rebuild --root-url "$BASE" randomparity/tap/rusty-imap-mcp
          # brew bottle writes a DOUBLE-dash local file; Homebrew downloads the
          # SINGLE-dash form from root_url. Rename before upload.
          dd_file="$(ls rusty-imap-mcp--"${VERSION}".*.bottle.tar.gz)"
          sd_file="${dd_file/--/-}"
          mv "$dd_file" "$sd_file"
          gh release upload "$TAG" "$sd_file" --repo randomparity/rusty-imap-mcp --clobber
          mkdir -p "$GITHUB_WORKSPACE/bottle-json"
          cp ./*.json "$GITHUB_WORKSPACE/bottle-json/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bottle-json-${{ matrix.os }}
          path: bottle-json/*.json
          if-no-files-found: error

  # Fold the per-platform bottle metadata into the tap formula and push a second
  # tap commit. If any bottle leg fails, this is skipped and the formula stays
  # bottle-less (degrades to the binary-download install path).
  bottles-merge:
    name: Add bottle block to formula
    needs: bottles
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: homebrew-tap
    permissions:
      contents: read
    steps:
      # Credentialed checkout of the tap: pushes use the token persisted by
      # actions/checkout (git's http.extraheader), so the PAT never lands in a
      # remote URL or .git/config. Mirrors the `homebrew` job.
      - name: Checkout tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: randomparity/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true
      - name: Set up Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Download bottle JSONs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bottle-json-*
          path: bottle-json
          merge-multiple: true
      - name: Merge bottle block and push to tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew tap randomparity/tap
          # Homebrew refuses to load a non-official formula that --merge loads by
          # tap context unless it is trusted; trust the single formula.
          brew trust --formula randomparity/tap/rusty-imap-mcp
          brew bottle --merge --write --no-commit bottle-json/*.json
          # brew writes the bottle block into its own tap clone; copy the result
          # into the credentialed checkout and push from there.
          cp "$(brew --repository randomparity/tap)/Formula/rusty-imap-mcp.rb" \
            tap/Formula/rusty-imap-mcp.rb
          cd tap
          # A bottle block makes Homebrew pour instead of build, with no source
          # fallback; gate the push on the formula parsing as Ruby.
          ruby -c Formula/rusty-imap-mcp.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rusty-imap-mcp.rb
          if git diff --staged --quiet; then
            echo "Formula already carries the bottle block for ${TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "rusty-imap-mcp ${TAG#v}: add bottles"
          git push

  # After a stable release, open a PR bumping the workspace to the next -dev
  # (ADR-0003). Skipped for prerelease tags and non-tag events.
  post-release-bump:
    name: Open post-release version-bump PR
    needs: [release]
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: stable) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: stable
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked --version 0.13.11
      - name: Compute next -dev and rewrite versions
        id: bump
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          released="${TAG#v}"
          IFS=. read -r major minor patch <<< "$released"
          next="${major}.${minor}.$((patch + 1))-dev"
          cargo set-version --workspace "$next"
          cargo update --workspace
          cargo update --manifest-path html-oracle/Cargo.toml -p rimap-core -p rimap-content
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk 'BEGIN{done=0} /^## \[/ && !done {print "## [Unreleased]"; print ""; done=1} {print}' \
              CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/post-release-bump-v${{ steps.bump.outputs.next }}
          commit-message: "chore: bump version to ${{ steps.bump.outputs.next }} after ${{ github.ref_name }} release"
          title: "chore: bump version to ${{ steps.bump.outputs.next }} after ${{ github.ref_name }}"
          add-paths: |
            Cargo.toml
            Cargo.lock
            crates/*/Cargo.toml
            html-oracle/Cargo.lock
            CHANGELOG.md
          body: |
            Automated post-release bump to `${{ steps.bump.outputs.next }}` after the `${{ github.ref_name }}` release (ADR-0003).

            **CI kick-off required before merge:** PRs opened by `GITHUB_TOKEN` do not trigger `pull_request` CI. Push an empty commit to this branch, or run `just ci` locally, to get a green signal. If the next release is a minor/major bump, edit the version on this PR first.

  # Post-publish signal (not a gate): a downstream leaf whose failure does NOT
  # un-publish the release. Pins the version so it never touches the rate-limited
  # latest-version API from a shared runner IP. Verifies --version INDEPENDENTLY
  # of install.sh's advisory (always-0) exit code.
  installer-smoke:
    name: Installer smoke
    needs: release
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install via the user-facing install.sh and verify version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export RUSTY_IMAP_MCP_INSTALL_DIR="$HOME/.local/bin"
          export RUSTY_IMAP_MCP_VERSION="$TAG"   # pin: no live API call
          sh ./install.sh
          expected="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          got="$("$RUSTY_IMAP_MCP_INSTALL_DIR/rusty-imap-mcp" --version)"
          echo "expected contains: $expected ; got: $got"
          case "$got" in
            *"$expected"*) echo "version OK" ;;
            *) echo "::error::version mismatch: want *$expected* got $got" >&2; exit 1 ;;
          esac
      # Exercise the README "verifiable path" end-to-end: download the released,
      # version-baked install.sh asset, verify it against SHA256SUMS.txt, then run
      # it with NO version override so the baked-in default (not an env pin) drives
      # the install. Covers the marker-substitution + baked default e2e.
      - name: Verify + run the released install.sh asset (baked default)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          base="https://github.com/randomparity/rusty-imap-mcp/releases/download/${TAG}"
          work="$(mktemp -d)"
          cd "$work"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o install.sh "${base}/install.sh"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o SHA256SUMS.txt "${base}/SHA256SUMS.txt"
          grep -E '  install\.sh$' SHA256SUMS.txt | sha256sum --check --strict -
          export RUSTY_IMAP_MCP_INSTALL_DIR="$HOME/.local/bin-asset"
          sh ./install.sh
          got="$("$RUSTY_IMAP_MCP_INSTALL_DIR/rusty-imap-mcp" --version)"
          case "$got" in
            *"$expected"*) echo "baked-asset version OK" ;;
            *) echo "::error::baked asset version mismatch: want *$expected* got $got" >&2; exit 1 ;;
          esac
