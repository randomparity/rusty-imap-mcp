name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Every one of the 14 required status checks on `main` is a job in this
    # workflow, so whether this trigger fires decides whether a PR can merge
    # at all. The default type set is `opened, synchronize, reopened`, which
    # omits `edited` — and retargeting a PR's base branch fires `edited`, not
    # `synchronize`. A PR opened against some other base and then moved onto
    # `main` therefore started no run, and its required contexts were not red
    # and not skipped but *absent*, which branch protection reads as forever
    # `expected`. With `strict: true` there is no self-service recovery: the
    # author has to push an empty commit or close and reopen (#760).
    #
    # `edited` also fires on title and body edits, so a typo fix in the
    # description now costs a full CI round. That is the price of the shape
    # below, and it was chosen over the two cheaper-looking alternatives
    # because both trade a real verdict for one that only looks like a
    # verdict:
    #
    #   - A cheap gate job that every other job `needs:` — a `needs:`
    #     dependent is SKIPPED when its dependency is skipped, and a skipped
    #     required check SATISFIES branch protection. That hands out merges
    #     on 14 contexts that never ran. Same trap as the `sonarqube` job's
    #     `!cancelled()` guard below; see the reasoning there.
    #   - A per-job `if:` that skips unless `changes.base` is set — correct
    #     for the retarget case, but on a title-only edit it *replaces* the
    #     genuine green check runs already sitting on that SHA with `skipped`
    #     ones, converting real signal into protection-satisfying noise.
    #
    # The extra runs stay bounded: `concurrency` below cancels the in-flight
    # run for the same PR, so an edit during CI collapses into one round
    # rather than adding one.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Enforce the rustls-only invariant: OpenSSL is pinned in Cargo.lock via
      # dbus-secret-service's `vendored` -> `openssl?/vendored` weak edge, but
      # must never enter the build graph. Mirrors `just check-no-openssl`.
      - name: Assert OpenSSL stays out of the build graph
        run: |
          if cargo tree -i openssl-sys --all-features --target all 2>/dev/null | grep -q openssl-sys; then
            echo "::error::openssl-sys entered the build graph — rustls-only invariant broken"
            cargo tree -i openssl-sys --all-features --target all
            exit 1
          fi
          echo "ok: openssl-sys is not in the build graph"

  check-macos:
    name: check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked --all-targets

  test:
    name: test (stable)
    runs-on: ubuntu-24.04
    # Bound the job so a test that somehow escapes slow-timeout's per-test kill
    # (e.g. the runner OOMs and nextest's signal never lands) still surfaces
    # within a reasonable window rather than burning the 360-minute default (#728).
    # nextest's slow-timeout terminates individual hung tests at 180 s; the
    # container-backed e2e suite can boot ~20 containers at max-threads = 4, so
    # a full cold-pull run with 20 Dovecot boots is the practical ceiling.
    # 60 min covers that with room for the stable + doctest + e2e canary steps.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: cargo-nextest
      # --profile ci selects the bounded max-fail policy in
      # .config/nextest.toml (#625): an unrelated flake or container hiccup
      # no longer suppresses every other test's result.
      - run: cargo nextest run --workspace --locked --no-tests=pass --profile ci
      # nextest does not run doctests (upstream limitation), so the step above
      # skips every one silently. The `compile_fail,E0639` blocks that enforce
      # `#[non_exhaustive]` on `rimap_config::model::ImapConfig` (#665) and
      # `rimap_audit::record::ProcessEnd` (#706) are doctests -- a doctest
      # compiles as its own crate, which is the only place the attribute is in
      # force. Mirrors `just test-doc`; without it, dropping an attribute in a
      # conflict resolution leaves CI green.
      - run: cargo test --workspace --doc --locked
      # The main --workspace pass above runs with the default silent-skip
      # posture: container-gated e2e tests return early when no docker/podman
      # runtime is present, so a runtime hiccup would let them all vanish while
      # CI stays green. This step re-runs every container-gated binary under
      # RIMAP_REQUIRE_DOCKER=1, which flips the harness from silent-skip to a
      # hard failure. --no-tests=fail additionally guards against a binary being
      # renamed or dropped (zero tests selected). The binary regex auto-covers
      # any future e2e* binary without another CI edit.
      #
      # The selector spans two crates. rimap-imap was omitted until #636, which
      # widened the skip path from "no docker/podman binary" to "no reachable
      # daemon" — a strictly larger set of conditions, so leaving that crate
      # outside this arm would let a CI daemon outage silently delete its 28
      # container tests.
      #
      # It joins as `binary(dovecot) and test(case_01)`, not the whole binary:
      # this step is a canary for "did the harness skip?", and one container
      # boot answers that as well as 28 do. The --workspace pass above already
      # runs all 28 in parallel, whereas --no-capture pins this step to a single
      # test thread — so selecting the full binary would serialize ~28 Dovecot
      # boots and add minutes for no extra signal. If case_01 is ever renamed,
      # --no-tests=fail turns that into a loud failure here rather than a silent
      # loss of the canary. rimap-imap's other container binary, proton, stays
      # out on purpose: it needs a Proton Bridge no CI runner has.
      #
      # Deliberately NOT --profile ci (#625): this step runs only
      # container-backed e2e binaries, so under a dead or contended Docker
      # daemon every one of the 20 failures that profile would budget is
      # itself a slow container-boot timeout, not a fast in-process
      # assertion. Bounded-but-large is worse than aborting fast for this
      # specific arm — keep nextest's built-in fail-fast = true here so a
      # daemon outage fails this step in seconds instead of minutes.
      - name: e2e suites — fail if container runtime unavailable or zero tests selected
        run: |
          cargo nextest run -p rimap-server -p rimap-imap \
            -E 'binary(/e2e/) + (binary(dovecot) and test(case_01))' \
            --locked --no-tests=fail \
            --no-capture
        env:
          RIMAP_REQUIRE_DOCKER: "1"

  msrv:
    name: test (MSRV 1.88.0)
    runs-on: ubuntu-24.04
    # Same reasoning as the `test` job above (#728): bound the job as a backstop
    # for the case where nextest's per-test kill does not land. The MSRV job
    # runs no e2e binaries (no RIMAP_REQUIRE_DOCKER step), so 45 min is enough.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.88.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features --locked
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass --profile ci

  tool-schema-drift:
    name: tool-schema drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: tool-schema-drift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just
      - name: Regenerate tool schemas
        run: just regen-tool-schemas
      - name: Verify no schema drift
        run: |
          if ! git diff --exit-code crates/rimap-server/tests/fixtures/rimap-tool-schemas/; then
            git diff --stat crates/rimap-server/tests/fixtures/rimap-tool-schemas/
            echo "::error::Tool schemas are out of sync — run 'just regen-tool-schemas' and commit the updated fixture files"
            exit 1
          fi

  tools-doc-drift:
    name: tools-doc drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: tools-doc-drift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just
      - name: Regenerate docs/tools.md
        run: just gen-tools-doc
      - name: Verify no tools-doc drift
        run: |
          if ! git diff --exit-code docs/tools.md; then
            git diff --stat docs/tools.md
            echo "::error::docs/tools.md is out of sync — run 'just gen-tools-doc' and commit the updated reference"
            exit 1
          fi

  # crates.io publish guardrails (issue #544): per-crate metadata validity
  # (category slugs `cargo publish --dry-run` cannot check offline) and the
  # publish-script function tests. No libdbus/build — `cargo metadata` only
  # reads manifests and the script tests are pure bash.
  publish-checks:
    name: publish checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just
      - name: Validate publish metadata
        run: just check-metadata
      - name: Unit-test publish-crates.sh
        run: just test-publish-script
      # post-release-bump runs once per release, against a workspace layout
      # that has grown since the job was written. Nothing else exercises it on
      # a normal branch, which is how its file set fell three files behind
      # (issue #662). Pure bash plus one read-only git read — same profile as
      # the publish-script tests above.
      - name: Unit-test post-release-bump.sh
        run: just test-post-release-bump
      # semver-baseline.sh picks the baseline for BOTH the `semver-checks` job
      # below and release.yml's publish gate (issue #650). Its cases build
      # throwaway git repos in a temp dir, so they run here rather than in
      # `semver-checks`: no cargo, no network, and no dependence on this
      # checkout's tags — which this job deliberately does not fetch.
      - name: Unit-test semver-baseline.sh
        run: just test-semver-baseline
      # prune-containers.sh picks the container runtime the `test` recipe's
      # nextest run will actually use, so a divergence between the two is
      # silent otherwise (issue #689). Its cases drive the script against fake
      # docker/podman binaries in an isolated PATH — no real runtime, no
      # network — so it runs here alongside the other pure-bash script tests.
      - name: Unit-test prune-containers.sh
        run: just test-prune-containers

  # Public-API SemVer gate (issue #633). Until this job existed,
  # `cargo semver-checks` ran only in release.yml's `publish` job, so a PR that
  # broke a published crate's public API went green and the *release* reddened
  # later with the break already on `main`.
  #
  # Its own job rather than a step in `publish-checks`: `publish-checks` is a
  # manifest-only job that never builds, and this needs two full rustdoc builds
  # (branch + baseline), which would turn a ~1 min job into a ~10 min one.
  #
  # `just semver-checks` baselines on the last `vX.Y.Z` tag, not on crates.io —
  # the registry holds only `0.0.0` placeholder reservations, against which no
  # break is expressible. See the recipe comment in the justfile.
  semver-checks:
    name: semver-checks
    runs-on: ubuntu-24.04
    # Two full workspace builds plus rustdoc, and the baseline tree is extracted
    # under target/semver-checks/, which rust-cache prunes before saving — so
    # the baseline half is always cold however warm the cache is.
    timeout-minutes: 45
    # `-D warnings` from the workflow env would apply to the *baseline* rustdoc
    # build too, failing this job on lints that a newer toolchain emits against
    # already-released code — a red gate that says nothing about SemVer. The
    # branch's own lint coverage is the `clippy` job's, not this one's.
    #
    # An empty value also overrides `build.rustflags` from a `.cargo/config.toml`
    # rather than merging with it. There is no such file today; if one is added,
    # this job stops honouring it. Same applies to RUSTDOCFLAGS, which no
    # workflow sets — a workflow-level one would need a matching override here.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The baseline is resolved with `git describe`, which needs the tags
          # and the history back to the last one. A shallow clone has neither.
          fetch-depth: 0
      # rimap-config -> keyring -> dbus-secret-service links libdbus-1 at build
      # time, and the baseline build needs it just as the branch build does.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: semver-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just,cargo-semver-checks@0.48.0
      - name: Check public API against the last release tag
        run: just semver-checks

  # Dependency hygiene. The fuzz-lockfile parity gate (issue #608) lives here
  # because both are dependency-resolution gates, which is its thematic home.
  #
  # It was originally placed here for a second reason that no longer holds:
  # `publish checks` was not a required status check, so a gate wired into it
  # would have gone red while the PR merged anyway. Issue #613 closed that hole
  # — `publish checks`, `tool-schema drift` and `tools-doc drift` are now
  # required on main alongside `cargo-deny`, so job choice no longer decides
  # whether a gate enforces. Adding a new gate to `publish-checks` is once
  # again safe. See docs/ADR/0011-fuzz-lockfile-workspace-parity.md.
  #
  # Before adding a check to ANY job here, confirm that job's status-check name
  # is in main's required list; a job outside it runs without enforcing:
  #   gh api repos/randomparity/rusty-imap-mcp/branches/main/protection \
  #     --jq '.required_status_checks.contexts'
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just
      # Ahead of cargo-deny: the parity result must not be masked by an
      # advisory/bans failure. These are pure lockfile text analysis (python3
      # and git only, no cargo resolution, no network), so they cost seconds.
      - name: Unit-test check-fuzz-lock-parity.sh
        run: just test-fuzz-lock-parity
      - name: Check fuzz lockfile parity with the workspace
        run: just check-fuzz-lock-parity
      # ...and conversely, a parity failure must not hide an advisory, so this
      # still runs when an earlier step failed.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        if: ${{ !cancelled() }}
        with:
          command: check advisories licenses bans sources

  # `html-oracle/` is excluded from the workspace (root `Cargo.toml`) and carries
  # its own `Cargo.lock` and `deny.toml`, so every job above compiles past it.
  # Until this job existed, a PR touching only `html-oracle/**` collected a full
  # set of green required checks that never built the thing it changed — and
  # Dependabot opens `deps(html-oracle)` PRs weekly by design (#699). The
  # scheduled `nightly-html-oracle.yml` was the first real verification, i.e.
  # after merge.
  #
  # Deliberately NOT `paths:`-filtered. A required status check that is
  # path-filtered never reports on PRs that miss those paths, and GitHub reads
  # "never reported" as unsatisfied — which would wedge every unrelated PR under
  # this repo's strict branch protection. `ci.yml` carries no `paths:` filter
  # anywhere; keep it that way.
  #
  # Named distinctly from `nightly-html-oracle.yml`'s `html-oracle` job: a
  # `workflow_dispatch` of the nightly on a branch would otherwise publish a
  # check run under the same name and shadow this one's result.
  #
  # Corpus scale stays the nightly's job. This runs against the in-repo fixtures
  # only — no `CORPUS_READ_TOKEN`, no `--corpus-min-compared` floor.
  #
  # `--locked` throughout, on all four cargo steps. The oracle path-depends on
  # `rimap-content`/`rimap-core`, whose requirements come from the root
  # `[workspace.dependencies]`, so a root bump across a semver boundary
  # invalidates `html-oracle/Cargo.lock` and fails this gate with a bare cargo
  # error. That coupling is intended — it is what stops the two graphs drifting
  # — but `scripts/check-fuzz-lock-parity.sh` deliberately excludes this
  # lockfile, so there is no automatic realignment. The fix is
  # `just realign-oracle-lock`, documented in AGENTS.md.
  #
  # Per the note on `deny` above: this only enforces once `html-oracle checks`
  # is in main's required-status-check list.
  html-oracle:
    name: html-oracle checks
    runs-on: ubuntu-24.04
    # Matches the nightly's budget for the same workload. Without it the job
    # inherits GitHub's 360-minute default, and a hang holds every PR
    # unmergeable under strict branch protection for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pinned like every other job here, and matching the crate's
      # `rust-version`. The nightly floats on `stable`; a required gate should
      # not go red because a new stable landed.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: html-oracle
          key: html-oracle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Version-pinned, not just SHA-pinned. `install-action` otherwise resolves
      # to whatever cargo-deny is latest at run time, and a release that tightens
      # a check reddens every open PR with no repo change — this repo already ate
      # that once when 0.19 started flagging path-dep wildcards (see the
      # `allow-wildcard-paths` note in html-oracle/deny.toml). Kept ahead of the
      # build steps on purpose: the audit step below runs on failure, so its tool
      # must already be installed by then.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: just,cargo-deny@0.19.0
      # Both steps run recipes rather than re-typed command strings, so `just ci`
      # covers this job exactly and the justfile's golden rule stays true.
      #
      # `oracle-checks` is fmt + clippy + test + the oracle itself. The first
      # three are the only place the excluded crate is fmt'd, linted against its
      # own `[lints.clippy]` table, or compiled at all. The fourth is the one
      # that matters most: `cargo test` never runs the differential comparison,
      # because those tests build synthetic tempdir corpora, so this is what
      # actually diffs the production sanitizer against `lol_html` (51 in-repo
      # fixtures, 26 compared). Deterministic — no network, no corpus checkout.
      # Exits non-zero on a HARD (silent-drop) divergence and on an inert run;
      # zero comparable inputs fails rather than greening, so this gate cannot
      # repeat the vacuous-green failure that motivated it.
      - name: Check, lint, test and run the oracle
        run: just oracle-checks
      # Runs even when the step above failed: a compile break must not mask an
      # advisory on a dependency bump, which is the exact PR shape this job
      # exists for. (This is also why `install-action` sits above the build
      # steps — a step with no `if:` is skipped on failure, so moving it down
      # would leave this one with no cargo-deny binary.)
      #
      # `advisories` is included, matching the root `cargo-deny` job, which is
      # already a required check running it. That means this gate can go red with
      # no repo change — a new RUSTSEC advisory or an upstream yank against a
      # `lol_html` transitive reddens open PRs overnight. That is the repo's
      # existing posture, not a new one; the escape hatch is a dated entry in
      # `html-oracle/deny.toml`'s `[advisories] ignore`.
      - name: Supply-chain audit (oracle graph)
        if: ${{ !cancelled() }}
        run: just oracle-deny
      # A HARD divergence prints one line per input to stderr; the report carries
      # the per-input detail that makes it diagnosable. Mirrors the nightly's
      # upload, narrowed to failures so green runs store nothing.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-oracle-pr-report
          path: html-oracle/report.json
          if-no-files-found: warn
          retention-days: 7

  zizmor:
    name: zizmor self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: zizmor
      - run: zizmor .github/workflows/

  # The coverage half of the SonarQube analysis. This job compiles and executes
  # every build script and proc macro in the dependency graph plus the
  # workspace's test binaries, so it must never hold a credential: a build
  # script can append to $GITHUB_ENV / $GITHUB_PATH and reach a later step in
  # the same job. It therefore names no `environment:` and reads no `secrets.*`
  # — the scan half below holds SONAR_TOKEN and compiles nothing, and the two
  # halves exchange `lcov.info` through a run-scoped artifact (#759).
  #
  # Adding a secret to this job, or a compile to the scan job, undoes the split.
  coverage:
    name: coverage (llvm-cov)
    # Run on `push` to main; on a PR, run only for a non-Dependabot PR whose
    # head branch lives in this repository. This is the same gate as the
    # `sonarqube` job below and the two must stay in step. It is duplicated
    # rather than shared because GitHub Actions has no job-level anchor or
    # reusable `if:`; the duplication fails loud rather than silent in the
    # direction that matters, because a scan job that runs where this one did
    # not reddens on its `needs.coverage.result` guard rather than scanning a
    # stale or absent report.
    #
    # The gate is no longer what keeps SONAR_TOKEN away from a freshly bumped
    # dependency graph — the split is (#759). It survives as a cost and blast-
    # radius control: it keeps a full instrumented build off every Dependabot
    # and fork PR, and it keeps fork head code from running on a job whose
    # cache the `push`-to-`main` run restores.
    #
    # Read from the PR itself, never from `github.actor`. The actor is whoever
    # triggered the *current* event, so clicking "Update branch" on a
    # Dependabot PR, or the realign push from dependabot-fuzz-lock.yml,
    # replaces it with a human or App identity and un-skips the job. That was
    # not theoretical: runs 31044452478, 31045404875 and 31046690877 are
    # Dependabot-authored PRs where "Update branch" made this job `success`
    # rather than `skipped` (#754). (Re-running a job does not do this —
    # `github.actor` stays the initial run's actor and `github.triggering_actor`
    # moves instead.) `pull_request.user.login` is the PR author, fixed when
    # the PR opens and unmovable by a later pusher, and `dependabot[bot]` is
    # unimpersonable because `[` and `]` are illegal in a GitHub login — the
    # same two properties dependabot-fuzz-lock.yml gates on.
    #
    # `head.repo.full_name == github.repository` rather than `head.repo.fork ==
    # false`: a PR from a since-deleted fork has `head.repo: null`, and GitHub
    # coerces both `null` and `false` to 0, so that comparison reads true and
    # runs the job on a fork PR. Comparing against a string fails closed.
    #
    # An event *allowlist*, not `github.event_name != 'pull_request'`. Both are
    # the same today, since this workflow triggers on exactly `push` and
    # `pull_request`. But a trigger added later (`merge_group`, or the
    # `pull_request_target` this repo already uses elsewhere) would satisfy a
    # denylist and open the fork guard completely, running both halves —
    # including the token-bearing scan — on fork head code. Under the
    # allowlist they skip instead: the scan is
    # silently lost until someone extends this line, which is the safe way to
    # be wrong. Naming `push` also keeps the condition free of any reliance on
    # how GitHub coerces the null `github.event.pull_request` — on `push` the
    # PR terms cannot change the result.
    #
    # That first term is load-bearing, not redundant: delete it and `push` to
    # `main` falls through to `head.repo.full_name == github.repository`, which
    # is `null` against a string and therefore false. Main-branch analysis
    # would stop silently and greenly, since nothing gates on a push run.
    #
    # Consequence worth knowing: a maintainer who takes over a Dependabot PR
    # and pushes hand-written code to that branch gets no scan, permanently and
    # greenly, because the author never changes. Push that work under a new
    # branch and open a fresh PR to get it scanned.
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.user.login != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: sonarqube
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Driven through `nextest`, not the bare `cargo llvm-cov` that runs
      # `cargo test` (#693). That default put this job three differences away
      # from "test (stable)" at once — instrumented, different runner, and
      # `.config/nextest.toml` applying to nothing here — so a flake seen only
      # on this arm read as an instrumentation cost when instrumentation was
      # measured at 1.02-1.27x and is the smallest of the three (#671, #692).
      # With nextest, each test gets its own process and the shared config
      # applies: `profile.ci`'s `fail-fast = { max-fail = 20 }` now bounds this
      # arm the same way it bounds the test jobs, and the `container-backed` /
      # `chaos-backed` groups and the 5s fatal `leak-timeout` now cover it.
      #
      # `--all-features` stays, and is deliberately NOT mirrored into "test
      # (stable)": it is what makes the feature-gated code (`test-support`,
      # `fuzzing`, `test-injection`, `vendored-keyring`) compile and count
      # toward coverage at all, and the one suite it additionally selects
      # (`proton-bridge-tests`) self-skips with no Proton Bridge to reach. The
      # required test arm should not be made to carry that suite just to match.
      #
      # `--no-tests=pass` matches "test (stable)" — a workspace member with no
      # tests is not a failure. nextest does not run doctests, and neither did
      # the `cargo test` this replaces: cargo-llvm-cov excludes them unless
      # `--doctests` is passed, so nothing is lost here (relevant to #708).
      #
      # `--success-output final` is load-bearing, not verbosity. nextest's
      # default is `success-output = "never"` and `--profile ci` inherits it,
      # so a *passing* test's stderr is captured and dropped — which is how the
      # #660 exit-wait probe and the #692 read-latency probe can both exist in
      # the harness and still emit nothing observable here. This arm is the
      # only place either distribution can be sampled on a hosted runner rather
      # than a developer host, and both budgets it feeds (`DETACHED_EXIT_TIMEOUT`,
      # `INSTRUMENTED_READ_FLOOR`) were sized without one. Same trap as #638,
      # where the discarded output was what would have identified the cause.
      # The samples are prefixed (`wire-read-probe`), so the tail is one grep.
      #
      # The capacity they were collected on is recorded alongside them, because
      # a latency distribution is not interpretable without it and every
      # previous read-budget issue (#621, #638, #671, #692) argued about runner
      # contention from the runner *label* rather than a measurement. It also
      # bounds what `.config/nextest.toml` can do here: nextest's default test
      # concurrency is the logical CPU count, so a test-group whose
      # `max-threads` equals that count cannot bind on this runner at all.
      - name: Record runner capacity
        run: |
          echo "logical CPUs: $(nproc)"
          cat /proc/loadavg
          free -m
      - name: Generate coverage report
        run: |
          cargo llvm-cov nextest --locked --workspace --all-features \
            --no-tests=pass --profile ci --success-output final \
            --lcov --output-path lcov.info
      # The scanner treats an empty or truncated lcov.info as "no coverage
      # data" and still exits 0, so a report that silently stopped being
      # produced would land as a green job with the quality gate reading
      # whatever it read last. Fail on zero records instead, and print the
      # totals so a later change to this arm can be diffed against them.
      - name: Verify lcov.info is non-empty and report totals
        run: |
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END {
              if (found == 0) {
                print "::error::lcov.info records no instrumented lines — the coverage report is empty"
                exit 1
              }
              printf "lcov.info: %d/%d lines covered (%.2f%%)\n", hit, found, 100 * hit / found
            }
          ' lcov.info
      # Intra-run hand-off to the scan job. Same run, same trust level, so no
      # `workflow_run` cross-trust handling is involved; the retention is one
      # day because nothing outside this run consumes it.
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  # The scan half. Holds SONAR_TOKEN and the `sonarcloud` environment, and
  # deliberately compiles nothing: no toolchain, no cargo, no dependency build
  # script runs in this job (#759). `lcov.info` arrives from `coverage` as an
  # artifact and is treated as data — read by the scanner, never interpreted as
  # a command here.
  sonarqube:
    name: SonarQube
    needs: coverage
    # `SonarQube` is a required status check on `main`, and this name is the
    # context string branch protection matches. Do not rename this job, and do
    # not move the name onto `coverage`: a required context that never reports
    # hangs pending forever rather than failing, and with `strict: true` there
    # is no self-service recovery — every PR in the repo becomes unmergeable
    # until someone edits protection.
    #
    # `!cancelled()` is what keeps the split from converting a required gate
    # into a decorative one. A `needs:`-dependent job is SKIPPED by default
    # when its dependency fails, and a skipped required check SATISFIES branch
    # protection — so without this the `SonarQube` context would go green while
    # the real failure sat on `coverage`, which protection does not require.
    # With it, a failed or skipped `coverage` reaches the guard step below and
    # this job reports RED. (`!cancelled()` rather than `always()`: a run
    # cancelled by `concurrency` should not manufacture a red check on a run
    # nobody is waiting for.) The alternative remedy — adding `coverage` to the
    # required contexts — was not taken, because it needs a branch-protection
    # edit and so cannot ship with the workflow change that requires it.
    #
    # The second half of the condition is the #754 gate, identical to the one
    # on `coverage`; see that job for why each term is shaped as it is. Both
    # jobs must carry it: with only this one, `coverage` would run on fork PRs.
    #
    # Every PR into `main` still reaches this job and reports a conclusion, so
    # the required check is never simply absent — a skipped required check
    # satisfies branch protection, a missing one wedges it. (A PR based on any
    # other branch does not start this workflow at all, and protection covers
    # only `main`.)
    if: >-
      !cancelled()
      && (github.event_name == 'push'
          || (github.event.pull_request.user.login != 'dependabot[bot]'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    # Naming an environment puts each use of the token in the deployment log
    # and gives a place to attach policy later. It does NOT currently scope the
    # secret: `SONAR_TOKEN` is a repository-level secret, and the `sonarcloud`
    # environment holds none, so any job in any workflow here can read it by
    # naming it. Moving the secret onto this environment would scope it to the
    # jobs that name the environment; the branch dimension stays open either
    # way, for the reason below. Tracked in #755 — do not read this line as if
    # it had already happened.
    #
    # Do NOT add required reviewers or a deployment-branch policy here, which
    # an earlier version of this comment invited. SonarQube is a required
    # status check on `main`: a branch policy matches branch and tag names, so
    # it matches no `refs/pull/N/merge` ref and fails the job on every PR, and
    # required reviewers park it in `waiting` until a human approves, pending
    # the check on every PR. #755 proposes branch policies across all four
    # environments; its comment thread carves this one out for that reason.
    # dependabot-fuzz-lock.yml warns against required reviewers too, for a
    # different reason — that job is not a required check; a human gate would
    # simply reinstate the manual step it exists to remove.
    environment: sonarcloud
    steps:
      # Runs first and reddens the required check when `coverage` did not
      # succeed. `download-artifact` would fail too, but on a 404 that reads
      # like an infrastructure fault; this says which job concluded what.
      - name: Require a successful coverage build
        if: ${{ needs.coverage.result != 'success' }}
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          echo "::error::coverage job concluded '${COVERAGE_RESULT}' — there is no lcov.info to scan"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Shallow clones disable blame information needed by SonarCloud.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lcov-coverage
      # `sonar.rust.lcov.reportPaths=lcov.info` is resolved relative to the
      # workspace, and the scanner exits 0 on a report it cannot read. The
      # producing job already validated the contents; this only confirms the
      # transfer landed something.
      - name: Verify the downloaded lcov.info is present and non-empty
        run: test -s lcov.info
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mcp-conformance-node:
    name: mcp-conformance (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # libdbus-1-dev + pkg-config are required because the workspace
      # keyring dependency enables Linux native keyring (secret-service)
      # support, which links against libdbus at build time. Every
      # existing Ubuntu Rust build job in this workflow installs these
      # for the same reason.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (toolchain: 1.94.0) # zizmor: ignore[superfluous-actions]
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: mcp-conformance-node
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --features test-support activates the --allow-empty-accounts
      # CLI flag (#[cfg(feature = "test-support")] in rimap-server).
      # Without it, the Node harness hits a clap rejection before the
      # MCP handshake.
      - name: Build rusty-imap-mcp (debug, test-support)
        run: cargo build -p rimap-server --bin rusty-imap-mcp --features test-support --locked

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tests/mcp-conformance/pnpm-lock.yaml

      - name: Install Node deps
        working-directory: tests/mcp-conformance
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: tests/mcp-conformance
        run: pnpm lint

      - name: Format check
        working-directory: tests/mcp-conformance
        run: pnpm format:check

      - name: Run conformance suite
        working-directory: tests/mcp-conformance
        env:
          RUSTY_IMAP_MCP_BIN: ${{ github.workspace }}/target/debug/rusty-imap-mcp
        run: pnpm test
