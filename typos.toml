[default]
extend-ignore-re = [
    # Allow hex blobs used in doc examples
    "[0-9a-f]{32,}",
    # Deliberate "emial" typo used as an example in scripts/check-publishable-metadata.sh
    # (illustrating an unknown crates.io category slug). Scope the ignore to that exact
    # usage so genuine "emial" typos elsewhere are still caught. Literal (single-quoted)
    # TOML string so the embedded quotes and `\.` pass through to the regex unescaped.
    'e\.g\. "emial"',
]

[default.extend-words]
# Intentional project vocabulary. Add sparingly with a comment.
imap = "imap"
rimap = "rimap"
# French word stem used in mUTF-7 test fixture ("Café")
caf = "caf"
# CVE Numbering Authority — a recognized industry acronym; typos incorrectly suggests "CAN"
CNA = "CNA"
# STRIDE table uses bold-letter notation (**I**nformation). Typos sees "nformation" as a fragment.
nformation = "nformation"
# Common technical prefix in hyphenated prose (mis-decoded, mis-signal, mis-upstreamed,
# mis-count, mis-set, mis-ordered). Typos flags the bare "mis" fragment.
mis = "mis"
# Valid English variant of "unparsable"; used in doc comments ("skipping unparseable lines").
unparseable = "unparseable"

[default.extend-identifiers]
# IMAP SELECT command, pluralized in prose ("SELECTs"). Typos's camelCase
# splitter treats the trailing lowercase "s" as a new word boundary and
# flags the remaining "SELEC" fragment as a typo of "SELECT".
SELECTs = "SELECTs"
# IMAP DELETE command, pluralized in prose ("DELETEs"). Same all-caps-plural
# splitter trap as SELECTs: the trailing lowercase "s" splits off, leaving the
# "DELET" fragment flagged as a typo of "DELETE".
DELETEs = "DELETEs"

[files]
extend-exclude = [
    "target/",
    "Cargo.lock",
    # Plan documents quote example source and deliberately-malformed test
    # fixtures (e.g. truncated JSON strings). Both produce false positives
    # that the typos auto-fixer turns into harmful edits.
    "docs/superpowers/plans/",
    # Adversarial email corpus contains Unicode-poisoning and other
    # deliberately-malformed text (e.g. zero-width codepoints that split
    # "hello" into "hel\u200blo"). Typos misreads the fragments and its
    # auto-fixer would destroy the fixtures.
    "tests/injection-corpus/",
    # Fuzz seed corpus mirrors the adversarial injection-corpus fixtures.
    # Same rationale: deliberately-malformed content trips the typos checker.
    "fuzz/corpus/",
    # Vendored Unicode 16 TR39 confusables table. CJK codepoint names and
    # hex codepoint columns trip the typos auto-fixer.
    "crates/rimap-content/data/confusables.txt",
]
