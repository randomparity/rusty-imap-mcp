[package]
name = "rimap-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Configuration loading, validation, and credential resolution for rusty-imap-mcp."
categories = ["config", "email"]
keywords = ["imap", "config", "credentials", "mcp"]

[lints]
workspace = true

[features]
# Exposes test fixtures (in-memory `MockStore`, etc.) so downstream crates
# can reuse them in their own dev-dependencies without copying.
test-support = []
# Static-link libdbus so release Linux binaries carry no runtime libdbus-1.so
# dependency (needed for self-contained tarballs / Homebrew bottles). Off by
# default. Strong `dep:` form is required — keyring pulls dbus-secret-service
# through its own edge, so a weak `?/vendored` never fires. The dep is
# Linux-cfg-gated, so this is a clean no-op on macOS/Windows (no
# feature-resolution error under --all-features).
vendored-keyring = ["dep:dbus-secret-service", "dbus-secret-service/vendored"]

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.2.0-dev" }
utf7-imap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
keyring = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only, declared solely so `vendored-keyring` can turn on its `vendored`
# feature (static libdbus). keyring already pulls this crate in non-optionally
# on Linux via `linux-native-sync-persistent`; the weak `?/` reference in
# `[features]` applies `vendored` to that same instance.
dbus-secret-service = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dep enables `test-support` unconditionally for this crate's own
# integration tests, so `tests/non_exhaustive_validate.rs` sees the fixture
# constructors without `cargo test -p rimap-config --features test-support`.
# Path-only (no version): cargo drops path-only dev-deps from the published
# manifest, so `cargo publish` verify never resolves a not-yet-published self.
rimap-config = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
temp-env = { workspace = true }
