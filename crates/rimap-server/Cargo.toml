[package]
name = "rimap-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rusty IMAP MCP server: security-first MCP server for IMAP email access."
categories = ["email", "command-line-utilities"]
keywords = ["imap", "email", "mcp", "security"]

[lints]
workspace = true

[features]
default = []

# Exposes `mcp::fuzz_oracle` for the cargo-fuzz target at
# `crates/rimap-server/fuzz/`. NEVER enable from another workspace
# member — the fuzz subcrate is the only legitimate consumer. Pulls in
# `jsonschema` (otherwise dev-only) so the oracle can schema-validate
# synthesized error envelopes. See
# docs/superpowers/specs/2026-05-17-cargo-fuzz-validator-design.md.
fuzzing = ["dep:jsonschema"]

# Gated entry points for integration tests that need to exercise the
# full dispatch pipeline (posture → breaker → rate → audit envelope →
# handler) without re-implementing the composition in each test.
# Also enables the `--allow-empty-accounts` CLI flag on the binary so
# the wire-conformance harness (#263) can boot with `accounts = []`;
# propagates to `rimap-config/test-support` to expose
# `load_and_validate_allowing_empty`.
#
# CONSTRAINT: code under `#[cfg(feature = "test-support")]` MUST NOT
# alter any MCP wire-protocol behavior — the initialize handshake,
# tools/list, resources/list, JSON-RPC error mapping, or notification
# acceptance. The Phase 2 Node conformance harness (issue #264) spawns
# this binary with `--features test-support` enabled; if any feature
# path here changes the wire shape, Phase 2 tests the test-support
# binary's wire shape rather than the production binary's, silently
# voiding its regression nets. See:
#   docs/superpowers/specs/2026-05-12-mcp-conformance-node-design.md §4.7
test-support = [
    "rimap-config/test-support",
    "rimap-content/test-support",
    # `rimap-audit/test-injection` exposes `AuditWriter::force_next_write_failure`,
    # which `main.rs`'s `maybe_arm_audit_write_failure` calls when
    # `RIMAP_TEST_FORCE_NEXT_AUDIT_WRITE_FAILURE=1` is set. Without this
    # flag, `cargo check -p rimap-server --features test-support
    # --bin rusty-imap-mcp` fails (Phase 4 #266, Codex review finding #2).
    # Adding it does not change the wire shape — the method only mutates
    # an internal failure-injection flag — so it complies with the
    # test-support wire-shape invariant above.
    "rimap-audit/test-injection",
]

# Static-link libdbus into the binary (release Linux legs only) so the shipped
# tarball / Homebrew bottle carries no runtime libdbus-1.so dependency. Off by
# default; no-op on macOS/Windows. See
# docs/superpowers/specs/2026-07-10-release-homebrew-phase1-design.md §1b.
vendored-keyring = ["rimap-config/vendored-keyring"]

[lib]
name = "rimap_server"
path = "src/lib.rs"

[[bin]]
name = "rusty-imap-mcp"
path = "src/main.rs"

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.2.1-dev" }
rimap-config = { path = "../rimap-config", version = "0.2.1-dev" }
rimap-authz = { path = "../rimap-authz", version = "0.2.1-dev" }
rimap-audit = { path = "../rimap-audit", version = "0.2.1-dev" }
rimap-content = { path = "../rimap-content", version = "0.2.1-dev" }
rimap-imap = { path = "../rimap-imap", version = "0.2.1-dev" }
rimap-smtp = { path = "../rimap-smtp", version = "0.2.1-dev" }
mail-builder = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
infer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# Dir-fd-anchored sandbox writes (#317): the destination directory is held as
# a capability `Dir` and files are created/linked fd-relative, closing the
# resolve→write directory-swap race without `unsafe`.
cap-std = { workspace = true }
anyhow = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
governor = { workspace = true }
arc-swap = { workspace = true }
tempfile = { workspace = true }
# Optional, gated by the `fuzzing` feature. The fuzz oracle
# schema-validates synthesized error envelopes against the vendored
# MCP `JSONRPCErrorResponse` fragment. Production builds (default
# features) do not pull this in. The `dev-dependencies` entry below
# remains for integration-test consumers; cargo dedupes the version.
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
jsonschema = { workspace = true }
mail-parser = { workspace = true }
rimap-audit = { path = "../rimap-audit", version = "0.2.1-dev", features = ["test-injection"] }
rimap-config = { path = "../rimap-config", version = "0.2.1-dev", features = ["test-support"] }
rimap-imap = { path = "../rimap-imap", version = "0.2.1-dev", features = ["test-support"] }
rimap-smtp = { path = "../rimap-smtp", version = "0.2.1-dev", features = ["test-support"] }
# Self dev-dep enables the `test-support` feature unconditionally for
# integration tests, so `ImapMcpServer::execute_tool_for_test` is in
# scope without every test harness passing `--features test-support`.
# Path-only (no version): cargo drops path-only dev-deps from the published
# manifest, so `cargo publish` verify never resolves a not-yet-published self.
rimap-server = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util"] }
tempfile = { workspace = true }
base64 = { workspace = true }
proptest = { workspace = true }
# Golden agent-transcript snapshots (issue #524): pins the JSON-RPC transcript
# an agent sees across a scripted session against the in-process fake.
insta = { workspace = true }
# Blocking HTTP client for the Mailpit retrieval API (e2e_smtp_real.rs).
ureq = { workspace = true }
# Shared scriptable adversarial IMAP fake (ADR-0008): drives the production
# binary against a scripted short-page FETCH for the fetch_skipped wire test.
rimap-fake-imap = { path = "../rimap-fake-imap" }
# Container-runtime selection, daemon probe, and skip-or-fail gate, shared by
# the Dovecot, Mailpit, and chaos harnesses here and by rimap-imap's Dovecot
# harness (issue #675). One selection and one probe per test process, even in
# e2e_smtp_real, which links two of those harnesses.
rimap-container-gate = { path = "../rimap-container-gate" }

# --- Native packaging (issue #545, ADR-0006). amd64/arm64 only; the packaged
# binary static-links libdbus (vendored-keyring), so no libdbus runtime dep.
# Man pages come from `just man` / the release `manpages` job into ../../man/man1.
#
# Asset source path bases differ between the two tools (source-verified):
#  * cargo-deb resolves non-`target/` sources relative to THIS manifest dir
#    (crates/rimap-server/), so the deb block uses `../../` for workspace-root
#    files; the `target/release/` binary prefix is special (rewritten for
#    --target).
#  * cargo-generate-rpm globs non-`target/` sources relative to the CWD (the
#    workspace root, where `cargo generate-rpm -p crates/rimap-server` runs), so
#    the rpm block uses NO `../../`.
[package.metadata.deb]
# The crate is rimap-server but the product/binary/installer/tarballs are all
# rusty-imap-mcp; name the package to match so users `apt install rusty-imap-mcp`.
name = "rusty-imap-mcp"
maintainer = "David Christensen <randomparity@gmail.com>"
copyright = "2026 David Christensen <randomparity@gmail.com>"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Security-first Model Context Protocol server for IMAP email access."
section = "mail"
priority = "optional"
# Explicit deps only: cargo-deb's $auto would ldd the wrong arch when packaging
# the arm64 binary on an x86_64 host. The binary is self-contained (vendored
# static libdbus), so glibc is the sole runtime requirement. Both arches are
# built in rust:1.88.0-bookworm (glibc 2.36), so declare that floor — the
# package manager then refuses cleanly on older systems instead of installing a
# binary that crashes at runtime with `GLIBC_x.xx not found`.
depends = "libc6 (>= 2.36)"
recommends = "ca-certificates"
assets = [
    ["target/release/rusty-imap-mcp", "usr/bin/", "755"],
    ["../../man/man1/rusty-imap-mcp.1", "usr/share/man/man1/", "644"],
    ["../../man/man1/rusty-imap-mcp-*.1", "usr/share/man/man1/", "644"],
    ["../../README.md", "usr/share/doc/rusty-imap-mcp/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/rusty-imap-mcp/CHANGELOG.md", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/rusty-imap-mcp/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/rusty-imap-mcp/LICENSE-APACHE", "644"],
    ["../../NOTICE", "usr/share/doc/rusty-imap-mcp/NOTICE", "644"],
]

[package.metadata.generate-rpm]
# Match the deb/product name (crate is rimap-server; product is rusty-imap-mcp).
name = "rusty-imap-mcp"
summary = "Security-first MCP server for IMAP email access"
# Disable rpm-build's automatic Requires (host ldd is wrong for a cross-built,
# statically-linked binary); declare the sole runtime dep explicitly.
auto-req = "no"

# Both arches build in rust:1.88.0-bookworm (glibc 2.36); declare that floor so
# dnf/rpm refuse cleanly on older systems rather than crash at runtime.
[package.metadata.generate-rpm.requires]
glibc = ">= 2.36"

[[package.metadata.generate-rpm.assets]]
source = "target/release/rusty-imap-mcp"
dest = "/usr/bin/rusty-imap-mcp"
mode = "755"
[[package.metadata.generate-rpm.assets]]
source = "man/man1/rusty-imap-mcp.1"
dest = "/usr/share/man/man1/rusty-imap-mcp.1"
mode = "644"
doc = true
[[package.metadata.generate-rpm.assets]]
source = "man/man1/rusty-imap-mcp-*.1"
dest = "/usr/share/man/man1/"
mode = "644"
doc = true
[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/rusty-imap-mcp/README.md"
mode = "644"
doc = true
[[package.metadata.generate-rpm.assets]]
source = "CHANGELOG.md"
dest = "/usr/share/doc/rusty-imap-mcp/CHANGELOG.md"
mode = "644"
doc = true
[[package.metadata.generate-rpm.assets]]
source = "LICENSE-MIT"
dest = "/usr/share/licenses/rusty-imap-mcp/LICENSE-MIT"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "LICENSE-APACHE"
dest = "/usr/share/licenses/rusty-imap-mcp/LICENSE-APACHE"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "NOTICE"
dest = "/usr/share/licenses/rusty-imap-mcp/NOTICE"
mode = "644"

