services:
  smtp:
    # Mailpit: SMTP sink with HTTP API for test assertions.
    # Pinned by multi-arch index digest — update via Dependabot or manually,
    # re-verifying amd64+arm64 with `docker manifest inspect`.
    # v1.29.5
    image: docker.io/axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    container_name: ${COMPOSE_PROJECT_NAME:-rimap-it}-smtp
    # Attach to the default bridge instead of a per-project network. Each
    # compose project otherwise allocates a dedicated bridge subnet, and the
    # full test suite runs many Dovecot + Mailpit projects concurrently, which
    # exhausts Docker's address pool ("all predefined address pools have been
    # fully subnetted"). The sink only needs its published loopback ports, not
    # inter-container networking, so the default bridge is sufficient and costs
    # no subnet.
    network_mode: "bridge"
    ports:
      # Loopback-only. Host ports pre-allocated by the Rust harness.
      - "127.0.0.1:${RIMAP_SMTP_HOST_PORT}:1025"    # SMTP
      - "127.0.0.1:${RIMAP_SMTP_API_PORT}:8025"      # HTTP API
    environment:
      # Accept any credentials, and permit AUTH over the plaintext loopback
      # connection so lettre's credentialed happy path succeeds.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Disable TLS — tests run over plaintext on loopback.
      MP_SMTP_TLS_CERT: ""
      MP_SMTP_TLS_KEY: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 1s
      timeout: 1s
      retries: 15
