[package]
name = "rimap-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
description = "SMTP client for rusty-imap-mcp — lettre wrapper with TLS and error mapping"
categories = ["email", "network-programming"]
keywords = ["smtp", "email", "mcp"]

[lints]
workspace = true

[features]
# Exposes the in-memory `rimap_smtp::testing::FakeSmtpSender` so this
# crate's own tests and downstream crates (rimap-server) can drive the
# SMTP seam without a live server. Off by default; never enabled in a
# release build.
test-support = []

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.1.0" }
rimap-config = { path = "../rimap-config", version = "0.1.0" }

lettre = { workspace = true }
thiserror = { workspace = true }
# `send_raw` bounds the whole SMTP operation with `tokio::time::timeout`
# (lettre only times out TCP connect). The workspace feature set includes
# `time`.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# Self dev-dep enables `test-support` for this crate's own tests so the
# fake and its tests compile under a plain `cargo test -p rimap-smtp`.
rimap-smtp = { path = ".", version = "0.1.0", features = ["test-support"] }
