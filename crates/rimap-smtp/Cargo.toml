[package]
name = "rimap-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
description = "SMTP client for rusty-imap-mcp — lettre wrapper with TLS and error mapping"
categories = ["email", "network-programming"]
keywords = ["smtp", "email", "mcp"]

[lints]
workspace = true

[features]
# Exposes the in-memory `rimap_smtp::testing::FakeSmtpSender` so this
# crate's own tests and downstream crates (rimap-server) can drive the
# SMTP seam without a live server. Off by default; never enabled in a
# release build.
test-support = []

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.3.0-dev" }
rimap-config = { path = "../rimap-config", version = "0.3.0-dev" }

lettre = { workspace = true }
thiserror = { workspace = true }
# `send_raw` bounds the whole SMTP operation with `tokio::time::timeout`
# (lettre only times out TCP connect). The workspace feature set includes
# `time`.
tokio = { workspace = true }
# lettre's async rustls transport wraps TLS handshake failures (incl. cert
# rejection) as Kind::Connection, so is_tls() misses them; the classifier
# walks the error source chain for a rustls::Error to map them to
# SmtpError::Tls. Already in-tree via lettre's tokio1-rustls-tls feature.
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "net", "io-util", "rt"] }
# The scripted SMTP responder (tests/support) serves a TLS handshake with a
# self-signed cert for the STARTTLS-failure scenario. (`rustls` itself is a
# normal dependency, used by the classifier's TLS detection.)
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
# Self dev-dep enables `test-support` for this crate's own tests so the
# fake and its tests compile under a plain `cargo test -p rimap-smtp`.
# Path-only (no version): cargo drops path-only dev-deps from the published
# manifest, so `cargo publish` verify never resolves a not-yet-published self.
rimap-smtp = { path = ".", features = ["test-support"] }
