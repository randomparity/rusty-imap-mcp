[package]
name = "rimap-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Crate-level license override: the code is MIT OR Apache-2.0 (workspace
# default), but data/confusables.txt is vendored Unicode 16.0 TR39 data under
# the Unicode License v3 (SPDX: Unicode-3.0). build.rs compiles it in, so the
# file ships in the package and the expression must cover it. Unicode-3.0 is
# already on deny.toml's allow list. Attribution: data/NOTICE.
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
repository.workspace = true
authors.workspace = true
description = "MIME parsing, Unicode-safe sanitization, and look-alike detection for rusty-imap-mcp."
categories = ["email", "parser-implementations", "text-processing"]
keywords = ["mime", "email", "sanitization", "unicode"]

[lints]
workspace = true

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.1.1-dev" }
schemars = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
mail-parser = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
encoding_rs = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-script = { workspace = true }
scraper = { workspace = true }
ammonia = { workspace = true }
linkify = { workspace = true }
idna = { workspace = true }
addr = { workspace = true }
phf = { workspace = true }

[build-dependencies]
phf_codegen = { workspace = true }

[features]
# Test/diagnostic helpers for out-of-tree tests and tooling. Enables
# `rimap_content::test_support` (label helpers and fuzz re-exports for
# the epvme_runner binary, fuzz harnesses, and integration tests).
# JsonSchema derives on wire-facing types are now unconditional (D1).
test-support = []

[[bin]]
name = "epvme_runner"
path = "src/bin/epvme_runner.rs"
required-features = ["test-support"]

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

# Self dev-dep (path-only, no version): enables `test-support` for this crate's
# own tests. cargo drops path-only dev-deps from the published manifest, so
# `cargo publish` verify never resolves a not-yet-published self.
[dev-dependencies.rimap-content]
path = "."
features = ["test-support"]

# `phf` is consumed by the `include!`-expanded output of `build.rs`, so
# static analyzers like cargo-machete cannot see the direct usage.
[package.metadata.cargo-machete]
ignored = ["phf"]
