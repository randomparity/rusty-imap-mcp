[package]
name = "rimap-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# TODO: data/confusables.txt is licensed under Unicode-DFS-2016. If
# this crate is ever published to crates.io, update the license field
# to reflect the vendored data and add "Unicode-DFS-2016" to the
# workspace deny.toml allow list.
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MIME parsing, Unicode-safe sanitization, and look-alike detection for rusty-imap-mcp."

[lints]
workspace = true

[dependencies]
rimap-core = { path = "../rimap-core", version = "0.1.1-dev" }
schemars = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
mail-parser = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
encoding_rs = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-script = { workspace = true }
scraper = { workspace = true }
ammonia = { workspace = true }
linkify = { workspace = true }
idna = { workspace = true }
addr = { workspace = true }
phf = { workspace = true }

[build-dependencies]
phf_codegen = { workspace = true }

[features]
# Test/diagnostic helpers for out-of-tree tests and tooling. Enables
# `rimap_content::test_support` (label helpers and fuzz re-exports for
# the epvme_runner binary, fuzz harnesses, and integration tests).
# JsonSchema derives on wire-facing types are now unconditional (D1).
test-support = []

[[bin]]
name = "epvme_runner"
path = "src/bin/epvme_runner.rs"
required-features = ["test-support"]

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies.rimap-content]
path = "."
version = "0.1.1-dev"
features = ["test-support"]

# `phf` is consumed by the `include!`-expanded output of `build.rs`, so
# static analyzers like cargo-machete cannot see the direct usage.
[package.metadata.cargo-machete]
ignored = ["phf"]
